<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Live to Roblox - Test Simulator</title>
    <style>
        :root {
            --bg: #0f1117;
            --card-bg: #1a1d27;
            --accent-pink: #fe2c55;
            --accent-cyan: #25f4ee;
            --accent-green: #00c853;
            --accent-orange: #ff9100;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #2e3648;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 24px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 860px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
        }

        .logo-group h1 {
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 99px;
            background: #334155;
            color: #cbd5e1;
            text-transform: uppercase;
        }

        .badge.online {
            background: rgba(0, 200, 83, 0.2);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }

        h2 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .grid-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }

        button {
            cursor: pointer;
            border: none;
            outline: none;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            color: white;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover {
            transform: translateY(-2px);
            opacity: 0.92;
        }

        button:active {
            transform: translateY(0);
        }

        .btn-rose { background: linear-gradient(135deg, #fe2c55, #ff0077); }
        .btn-donut { background: linear-gradient(135deg, #ff9100, #ff5722); }
        .btn-like { background: linear-gradient(135deg, #e91e63, #9c27b0); }
        .btn-follow { background: linear-gradient(135deg, #00c853, #009688); }
        .btn-chat { background: linear-gradient(135deg, #25f4ee, #0288d1); color: #000; }

        .input-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        input {
            flex: 1;
            background: #0f1117;
            border: 1px solid var(--border);
            padding: 10px 14px;
            border-radius: 8px;
            color: white;
            font-size: 14px;
        }

        input:focus {
            border-color: var(--accent-cyan);
            outline: none;
        }

        .log-box {
            background: #090a0f;
            border: 1px solid var(--border);
            border-radius: 8px;
            height: 220px;
            overflow-y: auto;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            line-height: 1.5;
            color: #a7f3d0;
        }

        .log-entry {
            margin-bottom: 4px;
            border-bottom: 1px dashed #1e293b;
            padding-bottom: 2px;
        }

        .log-time {
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-group">
                <h1>🎮 TikTok Live &harr; Roblox Studio Simulator</h1>
            </div>
            <div id="statusBadge" class="badge">SERVER: CHECKING...</div>
        </header>

        <div class="card">
            <h2>Koneksi TikTok Live Stream</h2>
            <div class="input-row">
                <input id="tiktokUser" type="text" placeholder="Masukkan username streamer (contoh: khaby.lame)" />
                <button id="btnConnect" style="background: var(--accent-pink); min-width: 140px;">Hubungkan</button>
                <button id="btnDisconnect" style="background: #475569;">Putus</button>
            </div>
        </div>

        <div class="card">
            <h2>Uji Interaksi Cepat (Simulator)</h2>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 14px;">
                Klik tombol di bawah untuk memasukkan event ke antrean secara instan tanpa perlu streaming atau menghabiskan koin sungguhan.
            </p>
            <div class="grid-buttons">
                <button class="btn-rose" onclick="sendEvent('gift', 'Rose', 1)">🌹 Kirim Rose (+1 Lantai)</button>
                <button class="btn-donut" onclick="sendEvent('gift', 'Donut', 1)">🍩 Kirim Donut (Tsunami!)</button>
                <button class="btn-like" onclick="sendEvent('like', 'Like', 25)">❤️ Kirim 25 Likes</button>
                <button class="btn-follow" onclick="sendEvent('follow')">⭐ Follow Stream</button>
            </div>
            <div class="input-row" style="margin-top: 14px;">
                <input id="chatMessage" type="text" placeholder="Tulis komentar simulasi penonton..." value="Keren banget gamenya bang!" />
                <button class="btn-chat" onclick="sendChat()" style="min-width: 130px;">💬 Kirim Chat</button>
            </div>
        </div>

        <div class="card">
            <h2>Activity Log Simulator</h2>
            <div id="logBox" class="log-box"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3000';
        const logBox = document.getElementById('logBox');
        const statusBadge = document.getElementById('statusBadge');

        function appendLog(text) {
            const time = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            div.className = 'log-entry';
            div.innerHTML = `<span class="log-time">[${time}]</span> ${text}`;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        async function checkStatus() {
            try {
                const res = await fetch(`${API_BASE}/status`);
                const data = await res.json();
                if (data.connected) {
                    statusBadge.className = 'badge online';
                    statusBadge.innerText = `ONLINE: @${data.username} (Queue: ${data.queueLength})`;
                } else {
                    statusBadge.className = 'badge';
                    statusBadge.innerText = `STANDBY (Queue: ${data.queueLength})`;
                }
            } catch (err) {
                statusBadge.className = 'badge';
                statusBadge.innerText = 'OFFLINE (Server belum jalan)';
            }
        }

        setInterval(checkStatus, 2000);
        checkStatus();

        document.getElementById('btnConnect').onclick = async () => {
            const username = document.getElementById('tiktokUser').value.trim();
            if (!username) return alert('Masukkan username TikTok terlebih dahulu!');
            appendLog(`Menghubungkan ke @${username}...`);
            try {
                const res = await fetch(`${API_BASE}/connect?username=${encodeURIComponent(username)}`);
                const data = await res.json();
                appendLog(data.message);
                checkStatus();
            } catch (err) {
                appendLog(`Error: ${err.message}`);
            }
        };

        document.getElementById('btnDisconnect').onclick = async () => {
            try {
                const res = await fetch(`${API_BASE}/disconnect`);
                const data = await res.json();
                appendLog(data.message);
                checkStatus();
            } catch (err) {
                appendLog(`Error: ${err.message}`);
            }
        };

        async function sendEvent(type, name = '', count = 1) {
            const user = 'Viewer_' + Math.floor(Math.random() * 900 + 100);
            try {
                const res = await fetch(`${API_BASE}/simulate?type=${type}&name=${name}&count=${count}&user=${user}`);
                const data = await res.json();
                appendLog(`✅ SIMULASI: [${type.toUpperCase()}] ${name} dari ${user}`);
                checkStatus();
            } catch (err) {
                appendLog(`❌ Gagal: ${err.message}`);
            }
        }

        async function sendChat() {
            const text = document.getElementById('chatMessage').value;
            const user = 'Viewer_' + Math.floor(Math.random() * 900 + 100);
            try {
                const res = await fetch(`${API_BASE}/simulate?type=chat&comment=${encodeURIComponent(text)}&user=${user}`);
                const data = await res.json();
                appendLog(`💬 CHAT dari ${user}: "${text}"`);
                checkStatus();
            } catch (err) {
                appendLog(`❌ Gagal: ${err.message}`);
            }
        }
    </script>
</body>
</html>
